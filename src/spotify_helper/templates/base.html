<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Playlist Helper{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23128a4a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="/">Playlist Helper</a>
  <nav>
    <a href="/">Playlists</a>
    <a href="/split" data-modal>Split</a>
    <a href="/genres" data-modal>Genres</a>
    <a href="/orphans" data-modal>Orphans</a>
    <a href="/overlap" data-modal>Overlap</a>
    <a href="/merge" data-modal>Merge</a>
    <a href="/move" data-modal>Move</a>
    <a href="/backups" data-modal>Backups</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<dialog id="modal" aria-label="Tool">
  <div class="modal-bar">
    <button type="button" class="btn secondary small" data-modal-back hidden>← Back</button>
    <span class="modal-status" aria-live="polite"></span>
    <button type="button" class="btn secondary small" data-close aria-label="Close">Close ✕</button>
  </div>
  <div class="modal-body"></div>
</dialog>
<div id="busy" hidden>Working… big playlists can take a minute the first time.</div>
<script src="/static/app.js"></script>
</body>
</html>
