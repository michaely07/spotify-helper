<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Playlist Helper{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Playlist Helper</a>
  <nav>
    <a href="/">Playlists</a>
    <a href="/split">Split</a>
    <a href="/orphans" data-busy>Orphans</a>
    <a href="/overlap">Overlap</a>
    <a href="/merge">Merge</a>
    <a href="/move">Move</a>
    <a href="/backups">Backups</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div id="busy" hidden>Working… big playlists can take a minute the first time.</div>
<script src="/static/app.js"></script>
</body>
</html>
