{% extends "base.html" %}
{% block content %}
<h1>Done</h1>
<div hidden data-updated='{{ totals|tojson }}' data-created="{{ created|tojson }}"></div>
<div class="card">
  <ul>{% for m in result.messages %}<li>{{ m }}</li>{% endfor %}</ul>
</div>
{% if result.backup_ids %}
<p>Changed something by mistake? <a href="/backups">Restore from a backup</a>.</p>
{% endif %}
<div class="actions"><a class="btn secondary" href="/" data-close>Back to playlists</a></div>
{% endblock %}
